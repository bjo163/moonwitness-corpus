name: Budge Materialization Verification (Read Only)

# FIX-002 / FIX-005: explicit audit only while source/rights gates are pending.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budge-materialization-audit
  cancel-in-progress: true

jobs:
  validate-budge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize and validate without publishing
        run: |
          pnpm materialize:ancient-egypt-budge
          pnpm validate:corpus
          pnpm validate:editions
      - name: Require committed generated dataset to match
        run: git diff --exit-code -- datasets/ancient-egypt-book-dead-budge
