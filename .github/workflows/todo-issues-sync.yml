name: TODO ↔ Issues Sync

on:
  push:
    branches: [main]
    paths:
      - TODO.md
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: todo-issues-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TODO → Issues
        if: github.event_name == 'push'
        run: pnpm exec tsx scripts/sync-todo-issues.ts todo-to-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODO_SYNC_NO_WRITE: '1'
          TODO_SYNC_MUTATION_DELAY_MS: 2200
          TODO_SYNC_MAX_RETRIES: 5

      - name: Issues → TODO (check only)
        id: reconcile
        if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm exec tsx scripts/reconcile-issue-status.ts --check 2>&1 | tee todo-sync-report.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 1 ]; then
            {
              echo '### TODO.md drift detected'
              echo 'The GitHub issue state no longer matches `TODO.md`. Open a pull request that updates the checkbox; this workflow does not write to protected branches.'
              echo '```'
              cat todo-sync-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload reconciliation report
        if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo-sync-report
          path: todo-sync-report.txt
          if-no-files-found: ignore

      - name: Fail on drift or sync error
        if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RECONCILE_STATUS: ${{ steps.reconcile.outputs.status }}
        run: |
          if [ "$RECONCILE_STATUS" = "1" ]; then
            echo "::error::TODO.md drift detected; update TODO.md through a pull request."
            exit 1
          fi
          if [ "$RECONCILE_STATUS" != "0" ]; then
            echo "::error::TODO reconciliation failed with status ${RECONCILE_STATUS:-unknown}."
            exit 1
          fi
