name: Upstream Source Audit (No Direct Push)

# Manual-only to avoid scheduled runner cost. Audits are read-only and
# network acquisition is opt-in and disposable.
on:
  workflow_dispatch:
    inputs:
      acquire:
        description: 'Run remote source acquisition into the ephemeral runner only (no commit/push)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-audit-dev
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile
      - name: Validate pinned upstream registries
        run: pnpm validate:upstream
      - name: Report source planner without writing back to GitHub
        run: pnpm upstream:list
      - name: Optional network-dependent acquisition in disposable checkout
        if: inputs.acquire == true
        env:
          UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}
        run: |
          pnpm upstream:audit
          pnpm sync:all
          pnpm check
      - name: Report only local working-tree change names
        if: always()
        shell: bash
        run: |
          {
            echo '## Upstream audit: read-only GitHub permissions'
            echo ''
            echo 'No git commit, push, release, or remote branch mutation in this workflow.'
            echo 'Remote acquisition requested: ${{ inputs.acquire }}'
            echo ''
            echo 'Changed local paths after inspection (NOT committed):'
            echo '~~~text'
            git status --short --untracked-files=normal
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
