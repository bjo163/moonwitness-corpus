name: Upstream Auto-Sync & Health Audit

on:
# Scheduled workflows are read from the default branch (main), not this dev file.
# Test dev sync explicitly; define the one production schedule on main only.
  workflow_dispatch:

concurrency:
  group: upstream-sync-dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile

      - name: Audit Upstream API Connectivity & Latency
        run: pnpm upstream:audit
        env:
          UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}

      - name: Synchronize All Upstream Sacred Text Sources
        run: pnpm sync:all
        env:
          UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}

      - name: Rebuild & Validate Master Corpus Pipeline
        run: pnpm check

      - name: Check for upstream updates & commit to dev
        shell: bash
        run: |
          set -euo pipefail
          # dist/ is derived and gitignored. Stage only intended corpus inputs.
          # Check the INDEX after staging, including newly created source files.
          git add -- ingestion/recipes/ datasets/
          if git diff --cached --quiet; then
            echo "No tracked upstream changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(upstream): auto-sync latest upstream corpus sources"
          git push origin HEAD:dev
