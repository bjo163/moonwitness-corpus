name: Materialize Ancient Egyptian Book of the Dead Renouf Naville 1904

on:
  workflow_dispatch:

concurrency:
  group: ancient-egypt-renouf-materialization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm materialize:ancient-egypt-renouf
      - run: pnpm validate:corpus
      - run: pnpm validate:editions
