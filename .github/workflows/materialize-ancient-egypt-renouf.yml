name: Materialize Ancient Egyptian Book of the Dead Renouf Naville 1904

on:
  workflow_dispatch:

concurrency:
  group: ancient-egypt-renouf-materialization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm materialize:ancient-egypt-renouf
      - run: pnpm validate:corpus
      - run: pnpm validate:editions
