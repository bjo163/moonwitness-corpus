name: Home Corpus Statistics

on:
  workflow_dispatch:

concurrency:
  group: home-stats-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-home-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sqlite
      - run: pnpm home:stats
