name: Main Dev Integration Rehearsal (Read Only)

# Disposable integration test. This NEVER commits, pushes, or creates a PR.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/integration-rehearsal.yml'
      - 'scripts/reconcile-integration-dry-run.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-main-integration-rehearsal
  cancel-in-progress: true

jobs:
  prove-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dev and fetch full history without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build local three-way merge in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/dev:refs/remotes/origin/dev'
          echo "Main SHA: $(git rev-parse origin/main)"
          echo "Dev SHA: $(git rev-parse origin/dev)"
          # Git requires an identity to prepare a merge even with --no-commit.
          # This config exists only inside the disposable runner checkout.
          git config user.name 'moonwitness-integration-preflight'
          git config user.email 'preflight@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code="$?"
          set -e
          if [[ "$merge_code" -ne 0 && "$merge_code" -ne 1 ]]; then
            echo "::error::Unexpected merge result: $merge_code. Review before resolution."
            exit 1
          fi
          if [[ "$merge_code" -eq 1 ]]; then
            node scripts/reconcile-integration-dry-run.mjs
            git diff --cached --check
            resolution_note='Five known conflicts explicitly resolved into disposable index.'
          else
            echo 'Main and dev merge cleanly; no conflict resolution was required.'
            resolution_note='Main and dev merge cleanly; no conflict resolution was required.'
          fi
          {
            echo '## Integration rehearsal (no GitHub ref changes)'
            echo ''
            echo "Dev source SHA: $(git rev-parse HEAD)"
            echo "Main fetched SHA: $(git rev-parse origin/main)"
            echo "$resolution_note"
            echo 'Both original API test suites retained.'
            echo 'No commit/push/branch was created.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reconstruct merged workspace lockfile without publishing
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Validate complete merged corpus and application
        run: pnpm check
      - name: Show local diff summary only
        if: always()
        shell: bash
        run: |
          {
            echo ''
            echo '### Local working tree differences (never uploaded/pushed)'
            echo '~~~text'
            git status --short | head -80
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
