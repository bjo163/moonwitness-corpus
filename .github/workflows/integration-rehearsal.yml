name: Main Dev Integration Rehearsal (Read Only)

# Disposable integration test. This NEVER commits, pushes, or creates a PR.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/integration-rehearsal.yml'
      - 'scripts/reconcile-integration-dry-run.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-main-integration-rehearsal
  cancel-in-progress: true

jobs:
  prove-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dev and fetch full history without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build local three-way merge in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/dev:refs/remotes/origin/dev'
          echo "Main SHA: $(git rev-parse origin/main)"
          echo "Dev SHA: $(git rev-parse origin/dev)"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code="$?"
          set -e
          if [[ "$merge_code" -ne 1 ]]; then
            echo "::error::Expected known merge conflicts; got $merge_code. Review before resolution."
            exit 1
          fi
          node scripts/reconcile-integration-dry-run.mjs
          git diff --cached --check
          {
            echo '## Integration rehearsal (no GitHub ref changes)'
            echo ''
            echo "Dev source SHA: $(git rev-parse HEAD)"
            echo "Main fetched SHA: $(git rev-parse origin/main)"
            echo 'Five known conflicts explicitly resolved into disposable index.'
            echo 'Both original API test suites retained.'
            echo 'No commit/push/branch was created.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reconstruct merged workspace lockfile without publishing
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Validate complete merged corpus and application
        run: pnpm check
      - name: Show local diff summary only
        if: always()
        shell: bash
        run: |
          {
            echo ''
            echo '### Local working tree differences (never uploaded/pushed)'
            echo '~~~text'
            git status --short | head -80
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
