name: Fast-Track Ancient Egyptian Corpus (Read Only Audit)

# FIX-002 / FIX-005: no periodic changes, automatic commits, or pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fasttrack-egypt-readonly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize without pushing generated content
        run: |
          pnpm materialize:ancient-egypt-budge
          pnpm validate:corpus
          pnpm validate:materialization
      - name: Detect uncommitted output differences
        run: git diff --exit-code -- datasets/ancient-egypt-book-dead-budge
