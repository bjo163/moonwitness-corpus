name: One-Time Safety — Cancel Pinned Legacy Mutating Runs

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cancel-stale-mutating-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-only-pinned-legacy-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cancel only three pinned stale unsafe runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          if (repo !== 'bjo163/moonwitness-corpus' || process.env.GITHUB_REF !== 'refs/heads/dev' || !token) {
            throw new Error('Ref/repository/token safety precondition failed');
          }
          const targets = [
            { id: 40061005830, sha: '0bd84f2ffa7637fba60daab80980cdacf562efeb', name: 'Aggressive Release' },
            { id: 40061136241, sha: '945764e8fe6af709abe9ab5f9e24cb7b76572530', name: 'Aggressive Release' },
            { id: 40061610730, sha: '9008a6c0979efb237ed6b24802bad915a14cd938', name: 'Materialize Ancient Egyptian Book of the Dead' },
          ];
          const root = 'https://api.github.com/repos/' + repo + '/actions/runs/';
          const headers = {
            authorization: 'Bearer ' + token,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
          };
          for (const target of targets) {
            const read = await fetch(root + target.id, { headers });
            if (!read.ok) throw new Error('Cannot verify run #' + target.id + ': HTTP ' + read.status);
            const run = await read.json();
            if (run.id !== target.id || run.name !== target.name || run.head_sha !== target.sha ||
                run.repository?.full_name !== repo) {
              throw new Error('Run identity mismatch for #' + target.id + '; refusing to cancel');
            }
            if (run.status === 'completed') {
              console.log('Already completed, no action for #' + target.id + ' (' + run.conclusion + ')');
              continue;
            }
            if (!['queued', 'pending', 'in_progress', 'waiting', 'requested'].includes(run.status)) {
              throw new Error('Unexpected state for #' + target.id + ': ' + run.status);
            }
            const cancel = await fetch(root + target.id + '/cancel', { method: 'POST', headers });
            if (cancel.status !== 202) throw new Error('Cancellation refused for #' + target.id + ': HTTP ' + cancel.status);
            console.log('Cancellation accepted for pinned unsafe run #' + target.id);
          }
          NODE
