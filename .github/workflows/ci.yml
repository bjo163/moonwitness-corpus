name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Hosted runner avoids indefinite queue when self-hosted runner is offline.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce workflow safety contracts
        run: node --test scripts/workflow-safety.test.mjs
      - run: pnpm check

      - name: Smoke test Fastify API Engine runtime & OpenTelemetry
        shell: bash
        run: |
          export PORT=3199
          pnpm serve > /tmp/moonwitness-api.log 2>&1 &
          API_PID=$!
          trap 'kill -9 "$API_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3199/v1/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/moonwitness-api.log
            exit 1
          fi

          grep -q '"status":"healthy"' /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:3199/metrics | grep -q 'corpus_indexed_records_total'
          curl --fail --silent --show-error http://127.0.0.1:3199/v1/traditions | grep -q '"success":true'
          curl --fail --silent --show-error 'http://127.0.0.1:3199/v1/search?q=mercy' | grep -q '"success":true'


  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify generated corpus catalog
        run: node scripts/export-web-catalog.mjs --check
      - name: Install web dependencies
        working-directory: apps/web
        run: npx --yes npm@11.6.0 ci
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Test web adapters
        working-directory: apps/web
        run: npm test
      - name: Build candidate browser database for web verification
        run: |
          node scripts/build-browser-search-db.mjs
          node scripts/chunk-browser-search-db.mjs
          node scripts/prepare-local-browser-db.mjs
      - name: Build web
        working-directory: apps/web
        run: npm run build
