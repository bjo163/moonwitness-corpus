name: Release Candidate Verification (No Promotion)

# FIX-005: fail-closed audit gate while dev/main histories diverge.
# No scheduled version bumps, publication, direct main pushes, or ref mutation.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/release.yml'
      - 'release/**'
      - 'CHANGELOG.md'
      - 'scripts/render-release-changelog.ts'
      - 'scripts/release-changelog.ts'
      - 'scripts/build-release.ts'
      - 'scripts/verify-release.ts'
      - 'scripts/build-consumer-release.ts'
      - 'scripts/validate-consumer-release.ts'

permissions:
  contents: read

concurrency:
  group: corpus-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify changelog matches release plans
        run: pnpm release:changelog:check
      - name: Build and validate release candidate without publishing
        run: pnpm build:release
      - name: Verify deterministic release checksums and manifest
        run: pnpm release:verify
      - name: Upload candidate evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-candidate-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
