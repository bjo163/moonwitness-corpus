name: Release Candidate Verification (No Promotion)

# FIX-005: fail-closed audit gate while dev/main histories diverge.
# No scheduled version bumps, publication, direct main pushes, or ref mutation.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/release.yml'
      - 'release/**'
      - 'CHANGELOG.md'
      - 'scripts/render-release-changelog.ts'
      - 'scripts/release-changelog.ts'
      - 'scripts/build-release.ts'
      - 'scripts/verify-release.ts'
      - 'scripts/build-consumer-release.ts'
      - 'scripts/validate-consumer-release.ts'

permissions:
  contents: read

concurrency:
  group: corpus-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify changelog matches release plans
        run: pnpm release:changelog:check
      - name: Build and validate release candidate without publishing
        run: pnpm build:release
      - name: Verify deterministic release checksums and manifest
        run: pnpm release:verify
      - name: Upload candidate evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-candidate-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
