name: Release Candidate Verification (No Promotion)

# FIX-005: fail-closed audit gate while dev/main histories diverge.
# No scheduled version bumps, publication, direct main pushes, or ref mutation.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/release.yml'
      - 'release/**'
      - 'scripts/build-release.ts'
      - 'scripts/verify-release.ts'
      - 'scripts/build-consumer-release.ts'
      - 'scripts/validate-consumer-release.ts'

permissions:
  contents: read

concurrency:
  group: corpus-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and validate release candidate without publishing
        run: pnpm build:release
      - name: Verify deterministic release checksums and manifest
        run: pnpm release:verify
      - name: Upload candidate evidence only
        uses: actions/upload-artifact@v4
        with:
          name: corpus-candidate-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
