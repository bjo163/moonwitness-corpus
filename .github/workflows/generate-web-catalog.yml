name: Verify Web Corpus Catalog

# Verification only: the catalog is a reviewed source artifact, so this
# workflow never commits or pushes to a canonical branch.
on:
  push:
    branches: [main, dev]
    paths:
      - "datasets/**"
      - "config/upstream-registry.json"
      - "config/textual-semantic-rules.json"
      - "scripts/export-web-catalog.mjs"
  pull_request:
    branches: [main, dev]
    paths:
      - "datasets/**"
      - "config/upstream-registry.json"
      - "config/textual-semantic-rules.json"
      - "scripts/export-web-catalog.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-corpus-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify canonical web catalog is current
        run: node scripts/export-web-catalog.mjs --check
