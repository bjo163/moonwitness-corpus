name: Verify Web Corpus Catalog

# Verification only: the catalog is a reviewed source artifact, so this
# workflow never commits or pushes to a canonical branch.
on:
  push:
    branches: [main, dev]
    paths:
      - "datasets/**"
      - "config/upstream-registry.json"
      - "config/textual-semantic-rules.json"
      - "scripts/export-web-catalog.mjs"
  pull_request:
    branches: [main, dev]
    paths:
      - "datasets/**"
      - "config/upstream-registry.json"
      - "config/textual-semantic-rules.json"
      - "scripts/export-web-catalog.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-corpus-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify canonical web catalog is current
        run: node scripts/export-web-catalog.mjs --check
